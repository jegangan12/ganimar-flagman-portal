<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Хаб блога. Кладётся в /blog/index.html.
       ЗАМЕНИТЬ: {{DOMAIN}}, {{BRAND}}, {{AUTHOR}}, {{TOPIC}} -->

  <title>Блог {{BRAND}}: {{TOPIC}}</title>
  <meta name="description" content="Практические материалы о {{TOPIC}}. Новые статьи выходят раз в неделю." />
  <link rel="canonical" href="https://{{DOMAIN}}/blog" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ru_RU" />
  <meta property="og:site_name" content="{{BRAND}}" />
  <meta property="og:title" content="Блог {{BRAND}}: {{TOPIC}}" />
  <meta property="og:url" content="https://{{DOMAIN}}/blog" />
  <link rel="alternate" type="application/rss+xml" title="Блог {{BRAND}}" href="/feed.xml" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Blog",
    "name": "Блог {{BRAND}}",
    "url": "https://{{DOMAIN}}/blog",
    "inLanguage": "ru-RU",
    "author": { "@type": "Person", "name": "{{AUTHOR}}" }
  }
  </script>

  <style>
    :root { --bg:#0c0b0a; --card:#141312; --line:rgba(255,255,255,.12); --accent:#f96f00; --gold:#e8a13c; --text:#cfcfcf; --dim:#8a8a8a; }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font:400 17px/1.8 -apple-system,'Segoe UI',Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
    .wrap { max-width:860px; margin:0 auto; padding:40px 20px 80px; }
    nav.top { border-bottom:1px solid var(--line); padding:18px 0; margin-bottom:36px; font-size:14px; letter-spacing:1.2px; text-transform:uppercase; }
    nav.top a { color:var(--dim); text-decoration:none; margin-right:20px; }
    nav.top a:hover { color:var(--gold); }
    h1 { font-size:clamp(30px,5vw,46px); color:#fff; line-height:1.2; margin-bottom:16px; }
    .lead { color:#b8b8b8; margin-bottom:44px; }
    .item { display:block; text-decoration:none; color:inherit; padding:24px 26px; margin-bottom:16px; background:var(--card); border:1px solid var(--line); border-radius:14px; transition:.25s; }
    .item:hover { border-color:rgba(249,111,0,.5); transform:translateY(-2px); }
    .item h2 { font-size:22px; color:#fff; margin-bottom:10px; line-height:1.3; }
    .item p { font-size:15px; color:var(--dim); }
    .meta { font-size:12px; letter-spacing:1.4px; text-transform:uppercase; color:var(--dim); margin-bottom:12px; }
    .meta .tag { color:var(--gold); border:1px solid rgba(249,111,0,.5); border-radius:999px; padding:3px 12px; margin-right:12px; }
    footer { border-top:1px solid var(--line); margin-top:48px; padding-top:24px; font-size:13px; color:var(--dim); }
    footer a { color:var(--gold); }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="top"><a href="/">Главная</a><a href="/blog">Блог</a></nav>

    <h1>Блог {{BRAND}}</h1>
    <p class="lead">Практические разборы о {{TOPIC}}. Новые материалы выходят раз в неделю</p>

    <!-- НА КАЖДУЮ НОВУЮ СТАТЬЮ ДОБАВЛЯЕТСЯ ОДИН ТАКОЙ БЛОК, НОВЫЕ — СВЕРХУ -->
    <a class="item" href="/blog/{{SLUG}}">
      <div class="meta"><span class="tag">{{CATEGORY}}</span><time datetime="{{DATE}}">{{DATE_HUMAN}}</time> · {{READ}}</div>
      <h2>{{H1}}</h2>
      <p>{{DESC}}</p>
    </a>

    <footer>&copy; {{BRAND}} · <a href="/feed.xml">RSS</a></footer>
  </div>
</body>
</html>
